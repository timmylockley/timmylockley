<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact | DevCraft</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav id="navbar">
        <div class="logo"><a href="index.html">DevCraft_</a></div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="services.html">Services</a></li>
            <li><a href="portfolio.html">Portfolio</a></li>
            <li><a href="faq.html">FAQ</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
        <div class="burger"><div class="line1"></div><div class="line2"></div><div class="line3"></div></div>
    </nav>

    <header class="page-header">
        <h1>Let's Talk</h1>
        <p>Ready to build something amazing?</p>
    </header>

    <div class="container">
        <form id="contact-form">
            <input type="text" id="name" placeholder="Your Name" required>
            <input type="email" id="email" placeholder="Your Email" required>
            <select style="width: 100%; padding: 1rem; background-color: var(--bg-card); border: 1px solid #333; border-radius: 5px; color: var(--text-muted); margin-bottom: 1.5rem;">
                <option value="">Select Project Type</option>
                <option value="web">Web Development</option>
                <option value="app">Mobile App</option>
                <option value="other">Other / Consultation</option>
            </select>
            <textarea id="message" rows="6" placeholder="Tell us about your project..." required></textarea>
            <button type="submit" class="btn">Send Message</button>
        </form>
    </div>

    <footer><p>&copy; 2026 DevCraft. All rights reserved.</p></footer>
    <script src="script.js"></script>
</body>
</html>
